<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Caisse Usine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: registre de caisse — barre du solde en haut, onglets, saisie à gauche / journal par jour à droite */
:root{
  --paper:#F1F4F1; --surface:#FFFFFF; --sunk:#E8EDE9; --ink:#14201A; --muted:#5B6A62; --line:#D7DFD9;
  --accent:#0D5A45; --accent-ink:#FFFFFF; --accent-soft:#DCEBE4;
  --in:#12784E; --in-soft:#E0F1E8; --out:#AE3A25; --out-soft:#F7E4DF; --warn:#9A6200; --warn-soft:#F8EBD2;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1412; --surface:#151D1A; --sunk:#1B2521; --ink:#E4EBE7; --muted:#90A097; --line:#27332E;
  --accent:#4DB38D; --accent-ink:#06231A; --accent-soft:#183A2E;
  --in:#4CC48B; --in-soft:#143325; --out:#F07A62; --out-soft:#3A1D17; --warn:#E3A63B; --warn-soft:#382A11; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1412; --surface:#151D1A; --sunk:#1B2521; --ink:#E4EBE7; --muted:#90A097; --line:#27332E;
  --accent:#4DB38D; --accent-ink:#06231A; --accent-soft:#183A2E;
  --in:#4CC48B; --in-soft:#143325; --out:#F07A62; --out-soft:#3A1D17; --warn:#E3A63B; --warn-soft:#382A11; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0}
body.auth header.top nav,body.auth .monthsel,body.auth .soldebox{visibility:hidden}
.authbox{max-width:400px;margin:48px auto}
.authbox h2{margin:0 0 6px}
body.ro #fab,body.ro #instForm,body.ro [data-settle],body.ro [data-tojournal],body.ro [data-idel],body.ro [data-reopen],body.ro #saveCount,body.ro #useBill,body.ro [data-remb],body.ro #mSaveSI,body.ro #mClose,body.ro #mReopen,body.ro #mImport,body.ro #openImport,body.ro #openImport2,body.ro #openCats,body.ro #mCats,body.ro #fmGo{display:none!important}
body.ro .odoo{pointer-events:none}
.userbtn{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-ui);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1240px;margin:0 auto}
.muted{color:var(--muted)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:14px 0;border-bottom:1px solid var(--line)}
.toprow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{margin:0;font-size:22px;font-weight:800;font-stretch:78%;letter-spacing:-.01em;text-transform:uppercase}
.brand .lock{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.monthsel{display:flex;align-items:center;gap:6px}
.monthsel select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:600;text-transform:capitalize}
.soldebox{margin-left:auto;text-align:right}
.soldebox .v{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1.1}
.soldebox .v small{font-size:14px;color:var(--muted);margin-left:4px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-size:11px;line-height:18px;text-align:center}

main{padding-top:18px}
.banner{padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);margin-bottom:14px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.ghost{background:none;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}

/* journal layout */
.jgrid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.formpanel{position:sticky;top:132px}
.formpanel h2{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:9px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:0;background:none;padding:8px;border-radius:7px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"].in{background:var(--in);color:#fff}
.seg button[aria-pressed="true"].out{background:var(--out);color:#fff}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.field input.amount{font-family:var(--f-num);font-size:20px;font-weight:600;text-align:right}
.field .hint{font-size:12px;color:var(--muted);min-height:16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.formactions{display:flex;gap:8px;margin-top:6px}
.formactions .btn.primary{flex:1}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding:10px;border-radius:8px;background:var(--out-soft);color:var(--out);font-weight:600}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.toolbar input[type=search]{flex:1 1 200px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.day{margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.dayhead .d{font-weight:800;font-stretch:82%;text-transform:uppercase;font-size:15px;letter-spacing:.01em}
.dayhead .w{font-size:12px;color:var(--muted);font-weight:600}
.dayhead .tot{margin-left:auto;display:flex;gap:14px;font-size:13px}
.op{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 16px;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.op:first-of-type{border-top:0}
.op:hover{background:var(--paper)}
.op.sel{background:var(--accent-soft)}
.op .t{min-width:0}
.op .t .main{font-weight:500;overflow-wrap:anywhere}
.op .t .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;align-items:center}
.cat{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cat.warn{background:var(--warn-soft);color:var(--warn)}
.ref{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.odoo{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;border:1px dashed var(--warn);color:var(--warn);background:none;cursor:pointer}
.odoo.ok{border:1px solid var(--in);color:var(--in);background:var(--in-soft)}
.amt{font-family:var(--f-num);font-weight:600;text-align:right;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--out)}
.run{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right;min-width:92px;white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin:0 0 6px}

.fab{display:none}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-family:var(--f-num);font-size:22px;font-weight:600;margin-top:4px;overflow-wrap:anywhere}
.kpi.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpi.main .lbl{color:inherit;opacity:.8}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.main .sub{color:inherit;opacity:.8}
.dgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.panel h3{margin:0 0 12px;font-size:15px}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.alert{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-weight:500}
.alert .btn{margin-left:auto}
.bars{display:flex;flex-direction:column;gap:2px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 4px;border-radius:6px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.bar:hover{background:var(--paper)}
.bar .track{grid-column:1/-1;height:7px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px}
.bar.sub{padding-left:18px}
.bar.sub .name{color:var(--muted)}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:6px 9px;border-radius:6px;font-size:12px;white-space:nowrap;transform:translate(-50%,-110%)}

/* comptage */
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.cline{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.cline:last-child{border-bottom:0}
.cline input{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:right;font-family:var(--f-num);font-weight:600;width:100%}
.cline .ro{text-align:right;font-family:var(--f-num);font-weight:600;padding:8px 10px}
.cline.total{border-top:2px solid var(--ink);border-bottom:0;margin-top:4px;font-weight:700}
.billets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.billet{display:flex;flex-direction:column;gap:3px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.billet span{font-family:var(--f-num);font-size:12px;font-weight:600}
.billet input{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:var(--surface);font-family:var(--f-num);width:100%}
.verdict{padding:16px;border-radius:var(--r);text-align:center;margin-top:14px}
.verdict .v{font-family:var(--f-num);font-size:28px;font-weight:600}
.verdict.ok{background:var(--in-soft);color:var(--in)}
.verdict.bad{background:var(--out-soft);color:var(--out)}
details summary{cursor:pointer;font-weight:600;color:var(--accent);margin-top:10px}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.done td{color:var(--muted);text-decoration:line-through}
.tblwrap{overflow-x:auto}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.ok{background:var(--in-soft);color:var(--in)}
.pill.due{background:var(--out-soft);color:var(--out)}
.inline-form{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.4fr) auto;gap:8px;margin-bottom:14px}
.inline-form input{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 10px}

.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;max-width:900px;margin:0 auto}
.rhead{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:flex-end;padding-bottom:16px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.rhead h2{margin:4px 0;font-size:24px;font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.rsec{padding:18px 0;border-bottom:1px solid var(--line)}
.rsec h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:15px}
.rsec h3 span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-family:var(--f-num)}
.rtbl tr.strong td{font-weight:700;border-top:2px solid var(--ink)}
.rtbl tr.grp td{font-weight:700;background:var(--sunk)}
.rtbl tr.sub td:first-child{padding-left:28px;color:var(--muted)}
.rtbl tr.clk{cursor:pointer} .rtbl tr.clk:hover td{background:var(--paper)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px}
.checks{display:flex;flex-direction:column;gap:8px}
.check{padding:10px 12px;border-radius:8px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.check.ok{background:var(--in-soft);color:var(--in)} .check.bad{background:var(--warn-soft);color:var(--warn)}
.check .muted{color:inherit;opacity:.85;font-size:13px}
.rdet{border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.rdet summary{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;margin:0;color:var(--ink);font-weight:600}
.rdet[open] summary{border-bottom:1px solid var(--line)}
.sign{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;border-bottom:0;padding-top:28px}
.sign .line{border-bottom:1px solid var(--ink);height:44px}
@media (max-width:520px){.report{padding:16px}.sign{grid-template-columns:minmax(0,1fr)}}
.wa textarea{width:100%;min-height:320px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--f-num);font-size:12.5px;line-height:1.5;resize:vertical}
.wopts{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px;font-size:13px}
.wopts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toolbar input[type=date]{padding:6px 10px}
a.btn{text-decoration:none;color:inherit}
@media (max-width:900px){
  .jgrid{grid-template-columns:minmax(0,1fr)}
  .formpanel{display:none;position:fixed;inset:auto 0 0 0;top:auto;z-index:30;border-radius:14px 14px 0 0;max-height:88vh;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25)}
  .formpanel.open{display:block}
  .fab{display:flex;position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:99px;padding:14px 20px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dgrid,.cgrid{grid-template-columns:minmax(0,1fr)}
  .inline-form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (max-width:520px){
  .soldebox{margin-left:0;text-align:left;width:100%}
  .op{grid-template-columns:minmax(0,1fr) auto}
  .op .run{grid-column:2}
  .dayhead .tot{margin-left:0;width:100%}
  .cline{grid-template-columns:minmax(0,1fr) 130px}
}
@media (prefers-reduced-motion:no-preference){.op,.bar,.btn{transition:background .12s,border-color .12s}}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="toprow">
    <div class="brand"><h1>Caisse Usine</h1><span class="lock" id="lockTag" hidden>Mois clôturé</span></div>
    <div class="monthsel"><select id="monthSel" aria-label="Mois"></select><button class="btn sm ghost" id="monthMenuBtn">Gérer le mois</button><button class="btn sm userbtn" id="userBtn" hidden>Compte</button></div>
    <div class="soldebox"><div class="lbl">Solde de caisse</div><div class="v" id="soldeTop">—<small>F</small></div></div>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="journal" aria-selected="true">Journal</button>
    <button role="tab" data-tab="jour" aria-selected="false">Rapport du jour</button>
    <button role="tab" data-tab="bord" aria-selected="false">Tableau de bord</button>
    <button role="tab" data-tab="comptage" aria-selected="false">Comptage</button>
    <button role="tab" data-tab="instances" aria-selected="false">Instances</button>
    <button role="tab" data-tab="avances" aria-selected="false">Prêts &amp; avances</button>
    <button role="tab" data-tab="compta" aria-selected="false">Rapport compta</button>
  </nav>
</div></header>

<main class="wrap" id="app">
  <div class="empty" id="boot"><h3>Ouverture de la caisse…</h3><p>Les opérations du mois vont s'afficher ici.</p></div>
</main>
<button class="btn primary fab" id="fab">+ Nouvelle opération</button>
<div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>

 ['mali','Transport Mali','Engins & transport'],['sangare','Sangaré','Engins & transport'],
 ['usine','Dépenses usine','Usine'],['travaux','Travaux usine','Usine'],['elec','Matériel électricité','Usine'],['plomb','Plomberie','Usine'],
 ['info','Informatique','Usine'],['mat','Sécurité','Usine'],['inf','Infirmerie','Usine'],['unite','Unités téléphone','Usine'],['divers','Divers','Usine'],

const FIELD = {c:'categorie', d:'date_op', t:'designation', e:'entree', s:'sortie', p:'personne'};
function sbErr(error){
  const msg=error?.message||'';
  if(/clôturé/.test(msg)) return {code:'closed', message:msg};
  if(error?.code==='42501' || /row-level security|permission/i.test(msg)) return {code:'invalid_argument', message:msg};
  if(/JWT|session/i.test(msg)) return {code:'revoked', message:msg};
  return {code:'unavailable', message:msg};
}
function parsePath(path){
  const s=path.split('/');
  if(s[0]==='months' && s.length===1) return {m:MAP.months};
  if(s[0]==='months' && s.length===2) return {m:MAP.months, id:s[1]};
  if(s[0]==='months' && s[2]==='ops' && s.length===3) return {m:MAP.ops, filter:{month:s[1]}, month:s[1]};
  if(s[0]==='months' && s[2]==='ops' && s.length===4) return {m:MAP.ops, id:s[3], month:s[1]};
  if(s[0]==='instances' && s.length===1) return {m:MAP.instances};
  if(s[0]==='instances' && s.length===2) return {m:MAP.instances, id:s[1]};
  if(s[0]==='config') return {m:MAP.settings, id:1};
  throw new TypeError('Chemin inconnu : '+path);
}
const listeners=new Set();
async function fetchRows(spec, extra){
  const out=[]; let from=0;
  for(;;){
    let q=SB.from(spec.m.table).select('*');
    if(spec.filter) for(const k in spec.filter) q=q.eq(k,spec.filter[k]);
    if(extra) for(const [k,v] of extra) q=q.eq(k,v);
    if(spec.id!=null) q=q.eq('id',spec.id);
    const {data,error}=await q.range(from,from+999);
    if(error) throw sbErr(error);
    out.push(...data); if(data.length<1000) break; from+=1000;
  }
  return out;
}
const colSnap = (spec,rows) => { const docs=rows.map(r=>({id:String(r.id), exists:true, data:()=>spec.m.fromRow(r)})); return {docs, size:docs.length, empty:!docs.length}; };
const docSnap = (spec,rows) => rows[0] ? {id:String(rows[0].id), exists:true, data:()=>spec.m.fromRow(rows[0])} : {id:String(spec.id), exists:false, data:()=>undefined};
function listen(spec, deliver, error){
  const L={table:spec.m.table, run:async()=>{ try{ deliver(await fetchRows(spec)); }catch(e){ error&&error(e); } }};
  listeners.add(L); L.run();
  return ()=>listeners.delete(L);
}
const pending={};
function refresh(table){ clearTimeout(pending[table]); pending[table]=setTimeout(()=>{ for(const L of listeners) if(L.table===table) L.run(); },150); }
async function write(spec, fn){ const {error}=await fn(SB.from(spec.m.table)); if(error) throw sbErr(error); refresh(spec.m.table); }
function makeDb(){
  const ref = path => {
    const spec=parsePath(path);
    if(spec.id==null){ // collection
      const where=[];
      const q={
        where:(f,op,v)=>{ where.push([FIELD[f]||f,v]); return q; },
        get:async()=>colSnap(spec, await fetchRows(spec, where)),
        onSnapshot:(next,err)=>listen(spec, rows=>next(colSnap(spec,rows)), err),
        doc:id=>ref(path+'/'+(id||crypto.randomUUID())),
        add:async data=>{ const id=crypto.randomUUID(); await ref(path+'/'+id).set(data); return ref(path+'/'+id); }
      };
      return q;
    }
    const base = () => spec.month ? {month:spec.month} : {};
    return {
      id:String(spec.id), path,
      get:async()=>docSnap(spec, await fetchRows(spec)),
      onSnapshot:(next,err)=>listen(spec, rows=>next(docSnap(spec,rows)), err),
      set:data=>write(spec, t=>t.upsert({id:spec.id, ...base(), ...spec.m.toRow(data)})),
      update:data=>write(spec, t=>t.update(spec.m.toRow(data)).eq('id',spec.id)),
      delete:()=>write(spec, t=>t.delete().eq('id',spec.id)),
      collection:sub=>ref(path+'/'+sub)
    };
  };
  SB.channel('caisse').on('postgres_changes',{event:'*',schema:'public'},p=>refresh(p.table)).subscribe();
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) ['months','ops','instances','settings'].forEach(refresh); });
  return {doc:ref, collection:ref};
}

async function boot(){
  const db = makeDb();
  S.db=db;
  if(!db){ renderNoDb(); return; }
  db.collection('months').onSnapshot(snap=>{
    S.months = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.id<b.id?1:-1);
    if(!S.month || !S.months.find(m=>m.id===S.month)){
      const open = S.months.find(m=>!m.closed);
      selectMonth(open? open.id : S.months[0]?.id || null);
    }
    renderMonthSel(); render();
  }, dbErr);
  db.collection('instances').onSnapshot(snap=>{ S.instances=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.date||'')<(b.date||'')?1:-1); render(); }, dbErr);
  db.doc('config/settings').onSnapshot(d=>{ const v=d.exists?d.data():{}; S.customCats=(v.cats||[]); if(v.odooBy) S.odooBy=v.odooBy; render(); }, dbErr);
}
function selectMonth(id){
  if(unsubOps){unsubOps();unsubOps=null} if(unsubMonth){unsubMonth();unsubMonth=null}
  S.month=id; S.ops=[]; S.opsLoaded=false; S.monthDoc=null; S.editId=null; S.allAvances=null;
  if(!id){ render(); return; }
  unsubMonth = S.db.doc('months/'+id).onSnapshot(d=>{ S.monthDoc=d.exists?d.data():null; render(); }, dbErr);
  unsubOps = S.db.collection('months/'+id+'/ops').onSnapshot(snap=>{ S.ops=snap.docs.map(d=>({id:d.id,...d.data()})); S.opsLoaded=true; S.allAvances=null; render(); }, dbErr);
}

  });

  else if(S.tab==='bord') renderBord(c);
  else if(S.tab==='comptage') renderComptage(c);
  else if(S.tab==='instances') renderInstances();
  else if(S.tab==='avances') renderAvances();
  else if(S.tab==='compta') renderCompta(c);
  else if(S.tab==='jour') renderJour(c);
  if(active && document.getElementById(active) && ['q'].includes(active)){ const el=document.getElementById(active); el.focus(); el.setSelectionRange?.(el.value.length,el.value.length); }

function dailySeries(c){
  const pts=[]; const n=lastDay(S.month); let run=c.si; const byDay={};
  for(const o of c.ops){ const d=+o.d.slice(8); byDay[d]=byDay[d]||{e:0,s:0,end:0}; byDay[d].e+=o.e||0; byDay[d].s+=o.s||0; byDay[d].end=o._run; }
  const lastOpDay = c.ops.length? +c.ops[c.ops.length-1].d.slice(8):0;
  for(let d=1; d<=Math.max(lastOpDay,1); d++){ if(byDay[d]) run=byDay[d].end; pts.push({d,v:run,e:byDay[d]?.e||0,s:byDay[d]?.s||0}); }
  return {pts,n};
}

  const vals=[c.si,...pts.map(p=>p.v)]; let lo=Math.min(0,...vals), hi=Math.max(...vals); if(hi===lo) hi=lo+1;
  const st=niceStep(hi-lo); lo=Math.floor(lo/st)*st; hi=Math.ceil(hi/st)*st;
  const x=d=>L+(d-1)/(Math.max(n-1,1))*(W-L-R), y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g=''; for(let v=lo; v<=hi+1e-6; v+=st){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v>=1e6?(v/1e6).toLocaleString('fr-FR',{maximumFractionDigits:1})+' M':fmt(v)}</text>`; }
  let xt=''; for(let d=1; d<=n; d+=(n>20?5:2)){ xt+=`<text x="${x(d)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d}</text>`; }
  const line=pts.map((p,i)=>(i?'L':'M')+x(p.d).toFixed(1)+','+y(p.v).toFixed(1)).join(' ');
  const area=line+` L${x(pts[pts.length-1].d).toFixed(1)},${y(lo)} L${x(1)},${y(lo)} Z`;
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du solde">${g}${xt}
    <path d="${area}" fill="var(--accent)" fill-opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(last.d)}" cy="${y(last.v)}" r="4.5" fill="var(--accent)"/>
    <line id="hov" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/>
    <rect id="hit" x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/></svg><div class="tip" id="tip" hidden></div>`;
}
function bindChart(c){
  const svg=$('#chart svg'); if(!svg) return; const {pts,n}=dailySeries(c); const W=760,L=64,R=14;
  const tip=$('#tip'), hov=$('#hov');
  svg.addEventListener('pointermove',e=>{
    const r=svg.getBoundingClientRect(); const px=(e.clientX-r.left)/r.width*W;
    let d=Math.round(1+(px-L)/(W-L-R)*(Math.max(n-1,1))); d=Math.max(1,Math.min(pts.length,d)); const p=pts[d-1]; if(!p) return;
    const sx=L+(d-1)/(Math.max(n-1,1))*(W-L-R); hov.setAttribute('x1',sx); hov.setAttribute('x2',sx); hov.setAttribute('visibility','visible');
    tip.hidden=false; tip.style.left=(sx/W*r.width)+'px'; tip.style.top='30px';
    tip.innerHTML=`${d} ${MOIS[+S.month.slice(5)-1]} · <b>${fmt(p.v)} F</b>${p.e||p.s?`<br>+${fmt(p.e)} / −${fmt(p.s)}`:''}`;
  });
  svg.addEventListener('pointerleave',()=>{ tip.hidden=true; hov.setAttribute('visibility','hidden'); });
}

// ---------- Rapport du jour ----------
const nsp = s => String(s).replace(/[  ]/g,' ');
function jourDefault(c){
  const t=todayISO(); if(t.startsWith(S.month) && c.ops.some(o=>o.d===t)) return t;
  return c.ops.length ? c.ops[c.ops.length-1].d : (t.startsWith(S.month)?t:S.month+'-01');
}
function jourData(c,d){
  const ops=c.ops.filter(o=>o.d===d);
  const before=c.ops.filter(o=>o.d<d); const start=before.length?before[before.length-1]._run:c.si;
  const ventes=ops.filter(o=>o.c==='vente'&&o.e>0);
  const autres=ops.filter(o=>o.e>0&&!(o.c==='vente'));
  const dep=ops.filter(o=>o.s>0);
  const sum=(a,f)=>a.reduce((x,o)=>x+(o[f]||0),0);
  return {ops,start,ventes,autres,dep,tv:sum(ventes,'e'),ta:sum(autres,'e'),td:sum(dep,'s'),end:start+sum(ops,'e')-sum(ops,'s')};
}
function jourTexte(c,d,J){
  const o=S.jopt; const F=n=>nsp(fmt(n))+' F'; const L=[];
  L.push('*RAPPORT CAISSE USINE*');
  L.push('📅 '+dayLabel(d).replace(/^./,x=>x.toUpperCase())+' '+d.slice(0,4));
  if(o.solde) L.push('Solde début de journée : '+F(J.start));
  L.push('');
  L.push('*✅ VENTES ('+J.ventes.length+')*');
  if(!J.ventes.length) L.push('Aucune vente');
  J.ventes.forEach((v,i)=>L.push((i+1)+'. '+v.t+(o.ref&&v.ref?' ('+v.ref+')':'')+' : '+F(v.e)));
  L.push('*Total ventes : '+F(J.tv)+'*');
  if(J.autres.length){ L.push(''); L.push('*➕ AUTRES ENTRÉES ('+J.autres.length+')*');
    J.autres.forEach(v=>L.push('• '+v.t+' : '+F(v.e))); L.push('*Total autres entrées : '+F(J.ta)+'*'); }
  L.push(''); L.push('*🔻 DÉPENSES ('+J.dep.length+')*');
  if(!J.dep.length) L.push('Aucune dépense');
  if(o.groupe){
    const by={}; J.dep.forEach(x=>{ const k=catOf(x.c).label; (by[k]=by[k]||[]).push(x); });
    Object.entries(by).sort((a,b)=>b[1].reduce((s,x)=>s+x.s,0)-a[1].reduce((s,x)=>s+x.s,0)).forEach(([k,arr])=>{ L.push('_'+k+'_'); arr.forEach(x=>L.push('• '+x.t+' : '+F(x.s))); });
  } else J.dep.forEach(x=>L.push('• '+x.t+' : '+F(x.s)));
  L.push('*Total dépenses : '+F(J.td)+'*');
  L.push(''); L.push('*BILAN DU JOUR*');
  L.push('Entrées : '+F(J.tv+J.ta));
  L.push('Dépenses : '+F(J.td));
  const net=J.tv+J.ta-J.td; L.push('Résultat : '+(net>=0?'+':'−')+F(Math.abs(net)));
  if(o.solde) L.push('*Solde fin de journée : '+F(J.end)+'*');
  return L.join('\n');
}

// ---------- Rapport comptabilité ----------
function comptaData(c){
  const k=S.monthDoc?.comptage||{}; const inst=instTotal(); const justif=countTotal(k)+inst;
  const inBy={}, outG={};
  for(const o of c.ops){
    if(o.e){ inBy[o.c]=inBy[o.c]||{n:0,t:0}; inBy[o.c].n++; inBy[o.c].t+=o.e; }
    if(o.s){ const g0=catOf(o.c).group, g=g0==='Entrées'?'Direction':g0; outG[g]=outG[g]||{t:0,n:0,cats:{}}; outG[g].t+=o.s; outG[g].n++; const x=outG[g].cats[o.c]=outG[g].cats[o.c]||{n:0,t:0}; x.n++; x.t+=o.s; }
  }
  const weeks={}; for(const o of c.ops){ const w=weekOfMonth(o.d); weeks[w]=weeks[w]||{e:0,s:0,from:o.d,to:o.d,end:0}; weeks[w].e+=o.e||0; weeks[w].s+=o.s||0; weeks[w].to=o.d; weeks[w].end=o._run; }
  return {k,inst,justif,ecart:justif-c.solde,inBy,outG:Object.entries(outG).sort((a,b)=>b[1].t-a[1].t),weeks,
    nc:c.ops.filter(o=>o.c==='aclasser'||!o.c), np:c.ops.filter(o=>o.c==='vente'&&!o.odoo&&o.e>0)};
}

async function exportCompta(c){
  if(typeof XLSX==='undefined'){ toast('Module Excel indisponible.'); return; }
  const dl = downloadsShim; if(!dl){ toast('Le téléchargement n\'est pas disponible ici.'); return; }
  const R=comptaData(c); const m=monthLabel(S.month).toUpperCase(); const ld=S.month+'-'+String(lastDay(S.month)).padStart(2,'0');
  const a=[[`RAPPORT DE CAISSE — ${m}`],[`Période du ${dFR(S.month+'-01')} au ${dFR(ld)} — édité le ${new Date().toLocaleDateString('fr-FR')}`],[],
    ['1. SYNTHÈSE','',''],['Solde d\'ouverture','',c.si],['Total entrées','',c.E],['Total sorties','',c.S],['Solde de clôture (journal)','',c.solde],[],
    ['2. CONTRÔLE PHYSIQUE','',''],['Espèces scellées','',+R.k.scelle||0],['Vrac','',+R.k.vrac||0],['Monnaie','',+R.k.monnaie||0],...MOBILE.map(([id,l])=>[l,'',+R.k[id]||0]),['Instances en cours','',R.inst],['Total justifié','',R.justif],['Écart (justifié − journal)','',R.ecart],[],
    ['3. ENTRÉES PAR RUBRIQUE','Nb','Montant']];
  for(const [k,v] of Object.entries(R.inBy).sort((x,y)=>y[1].t-x[1].t)) a.push([catOf(k).label,v.n,v.t]);
  a.push(['Total entrées','',c.E],[],['4. SORTIES PAR POSTE','Nb','Montant']);
  for(const [g,v] of R.outG){ a.push([g.toUpperCase(),v.n,v.t]); for(const [k,x] of Object.entries(v.cats).sort((p,q)=>q[1].t-p[1].t)) a.push(['    '+catOf(k).label,x.n,x.t]); }
  a.push(['Total sorties','',c.S],[],['5. PAR SEMAINE','Entrées','Sorties','Solde fin']);
  for(const [w,v] of Object.entries(R.weeks)) a.push([`Semaine ${w} (${dFR(v.from).slice(0,5)} – ${dFR(v.to).slice(0,5)})`,v.e,v.s,v.end]);
  a.push([],['6. POINTS À JUSTIFIER'],['Opérations sans rubrique',R.nc.length,R.nc.reduce((x,o)=>x+(o.e||0)+(o.s||0),0)],['Ventes non pointées Odoo',R.np.length,R.np.reduce((x,o)=>x+(o.e||0),0)],['Instances en cours',openInstances().length,R.inst]);
  a.push([],[],['Caissier','Comptabilité','Direction'],['','',''],['____________','____________','____________']);
  const ws=XLSX.utils.aoa_to_sheet(a); ws['!cols']=[{wch:42},{wch:14},{wch:16},{wch:16}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Rapport');
  const d=[['Sens','Poste','Rubrique','Date','Désignation','N° facture','Personne','Montant','Odoo']];
  for(const o of [...c.ops].sort((x,y)=>(catOf(x.c).group+x.c+x.d).localeCompare(catOf(y.c).group+y.c+y.d))){
    if(o.e) d.push(['Entrée',catOf(o.c).group,catOf(o.c).label,dFR(o.d),o.t,o.ref||'',o.p||'',o.e,o.odoo||'']);
    if(o.s) d.push(['Sortie',catOf(o.c).group,catOf(o.c).label,dFR(o.d),o.t,o.ref||'',o.p||'',o.s,o.odoo||'']);
  }
  const ws2=XLSX.utils.aoa_to_sheet(d); ws2['!cols']=[{wch:7},{wch:18},{wch:26},{wch:11},{wch:50},{wch:11},{wch:18},{wch:13},{wch:11}]; ws2['!autofilter']={ref:'A1:I'+d.length};
  XLSX.utils.book_append_sheet(wb,ws2,'Détail par rubrique');
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  try{ await dl.save({filename:`RAPPORT_COMPTA_CAISSE_${m.replace(' ','_')}.xlsx`,data:buf}); toast('Rapport prêt'); }
  catch(e){ if(e?.code!=='declined') toast('Export impossible ('+(e?.code||'erreur')+').'); }
}

  XLSX.utils.book_append_sheet(wb,ws1,'Journal');
  const by={}; for(const o of c.ops){ const k=o.c; by[k]=by[k]||{e:0,s:0}; by[k].e+=o.e||0; by[k].s+=o.s||0; }
  const r=[['Poste','Catégorie','Entrées','Sorties']]; for(const [k,v] of Object.entries(by).sort((a,b)=>catOf(a[0]).group.localeCompare(catOf(b[0]).group))) r.push([catOf(k).group,catOf(k).label,v.e,v.s]);
  r.push([],['','Solde d\'ouverture','',c.si],['','Total entrées',c.E,''],['','Total sorties','',c.S],['','Solde final',c.solde,'']);
  const ws2=XLSX.utils.aoa_to_sheet(r); ws2['!cols']=[{wch:20},{wch:30},{wch:14},{wch:14}]; XLSX.utils.book_append_sheet(wb,ws2,'Récap');
  const k=S.monthDoc?.comptage||{};
  const ws3=XLSX.utils.aoa_to_sheet([['Comptage',''],['Espèces scellées',k.scelle||0],['Vrac',k.vrac||0],['Monnaie',k.monnaie||0],...MOBILE.map(([id,l])=>[l,+k[id]||0]),['Instances',instTotal()],['Total justifié',countTotal(k)+instTotal()],['Solde journal',c.solde],['Écart',countTotal(k)+instTotal()-c.solde]]);
  ws3['!cols']=[{wch:20},{wch:14}]; XLSX.utils.book_append_sheet(wb,ws3,'Comptage');
  const ws4=XLSX.utils.aoa_to_sheet([['Nom','Motif','Montant','Statut'],...S.instances.map(i=>[i.nom||'',i.note||'',+i.montant||0,i.regle?'Réglé':'En cours'])]); XLSX.utils.book_append_sheet(wb,ws4,'Instances');
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  try{ await dl.save({filename:`CAISSE_${MOIS[+S.month.slice(5)-1].toUpperCase()}_${S.month.slice(0,4)}.xlsx`,data:buf}); toast('Fichier Excel prêt'); }
  catch(e){ if(e?.code!=='declined') toast('Export impossible ('+(e?.code||'erreur')+').'); }
}

// ---------- Import Excel (ancien format de caisse) ----------
function openImport(){
  modal(`<h3>Importer un fichier de caisse</h3><p class="muted">Choisis un fichier Excel au format de ton ancienne caisse (onglet « Caisse Général » : Date, Catégorie, Désignation, Entrée, Sortie, ODOO). Les opérations sont ajoutées au mois de leur date.</p>
    <input type="file" id="impFile" accept=".xlsx,.xls"><div id="impPrev" style="margin-top:12px"></div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" id="impGo" disabled>Importer</button><button class="btn ghost" id="impX">Fermer</button></div>`, ()=>{
    let parsed=null; $('#impX').onclick=closeModal;
    $('#impFile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
      try{ const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}); parsed=parseCaisse(wb);
        const ms=[...new Set(parsed.ops.map(o=>o.d.slice(0,7)))];
        $('#impPrev').innerHTML=`<div class="panel" style="padding:12px"><b>${parsed.ops.length}</b> opérations trouvées (${ms.map(monthLabel).join(', ')})<br>Entrées <span class="num">${fmt(parsed.ops.reduce((a,o)=>a+o.e,0))}</span> · Sorties <span class="num">${fmt(parsed.ops.reduce((a,o)=>a+o.s,0))}</span>${parsed.si!=null?`<br>Solde d'ouverture lu : <span class="num">${fmt(parsed.si)}</span>`:''}
          ${ms.some(m=>S.months.find(x=>x.id===m))?'<div class="banner" style="margin:8px 0 0">Attention : un de ces mois existe déjà. Les opérations seront ajoutées en plus (risque de doublons).</div>':''}</div>`;
        $('#impGo').disabled=!parsed.ops.length; }catch(err){ console.error(err); $('#impPrev').innerHTML='<div class="banner">Fichier illisible. Vérifie que c\'est bien un fichier Excel de caisse.</div>'; } };
    $('#impGo').onclick=async()=>{ const b=$('#impGo'); b.disabled=true; let i=0;
      try{
        const ms=[...new Set(parsed.ops.map(o=>o.d.slice(0,7)))];
        for(const m of ms) if(!S.months.find(x=>x.id===m)) await S.db.doc('months/'+m).set({soldeInitial:parsed.si||0,closed:false,comptage:{}});
        for(const o of parsed.ops){ i++; if(i%10===0) b.textContent=`Import… ${i}/${parsed.ops.length}`;
          await S.db.doc(`months/${o.d.slice(0,7)}/ops/imp${o.d.replace(/-/g,'')}-${String(i).padStart(4,'0')}-${Date.now().toString(36)}`).set(o); }
        closeModal(); selectMonth(ms[0]); renderMonthSel(); toast(parsed.ops.length+' opérations importées');
      }catch(e){ dbErr(e); b.textContent='Reprendre l\'import'; b.disabled=false; }
    };
  });
}
function parseCaisse(wb){
  const name=wb.SheetNames.find(n=>/caisse\s*g/i.test(n))||wb.SheetNames[0];
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true});
  const ops=[]; let si=null, n=0; const known=new Set(cats().map(c=>c.id));
  for(const r of rows){
    let [d,c,t,e,s,o]=r; if(!(d instanceof Date)) continue;
    e=typeof e==='number'?e:0; s=typeof s==='number'?s:0; if(!e&&!s) continue;
    t=String(t||'').trim();
    if(/^SOLDE AU/i.test(t)){ si=e-s; continue; }
    let cid=String(c||'').replace(/[\[\]]/g,'').trim().toLowerCase(); cid=ALIASES[cid]||cid; if(!known.has(cid)) cid='aclasser';
    const m=t.match(/\b([BS]0\d{5})\b/); let ref=''; if(m){ ref=m[1]; t=t.replace(new RegExp('\\s*\\b'+ref+'\\b'),'').trim(); }
    const dd=new Date(d.getTime()+12*3600e3); const iso=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
    n++; ops.push({d:iso,c:cid,t,e,s,ref,p:'',odoo:o?String(o).toUpperCase():'',seq:n*10});
  }
  return {ops,si};
}
